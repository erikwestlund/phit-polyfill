name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pest:
    name: PHP ${{ matrix.php }}, ${{ matrix.mode }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        php: ['8.5']
        mode: [no-opcache, opcache, jit, function-jit, function-jit-load]
        include:
          - os: macos-latest
            php: '8.5'
            mode: opcache
          - os: macos-latest
            php: '8.5'
            mode: function-jit
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: opcache
          coverage: none

      - run: composer install --no-interaction --no-progress --prefer-dist

      - name: Show PHP and OPcache settings
        run: |
          php -v
          php --ini
          php -d opcache.enable_cli=1 -i | grep -iE '^opcache\.(enable_cli|jit|jit_buffer_size|optimization_level|opt_debug_level|memory_consumption|file_update_protection) '

      # The extension is not installed here, so the parity suite is skipped and
      # the global stats_* functions come from the polyfill. OPcache's optimizer
      # is exercised explicitly (see docs/notes/opcache-nan.md); with
      # file_update_protection=0 it also optimizes freshly checked-out files.
      - name: Run tests
        run: |
          case "${{ matrix.mode }}" in
            no-opcache) flags="-d opcache.enable_cli=0" ;;
            # setup-php's php.ini enables opcache.jit=1235, so the optimizer-only
            # mode disables the JIT explicitly and function-jit keeps 1235.
            opcache) flags="-d opcache.enable_cli=1 -d opcache.file_update_protection=0 -d opcache.jit=disable" ;;
            function-jit) flags="-d opcache.enable_cli=1 -d opcache.file_update_protection=0 -d opcache.jit=1235 -d opcache.jit_buffer_size=128M" ;;
            # Compiles every function when its file loads, independent of hot counters.
            function-jit-load) flags="-d opcache.enable_cli=1 -d opcache.file_update_protection=0 -d opcache.jit=1205 -d opcache.jit_buffer_size=128M" ;;
            jit) flags="-d opcache.enable_cli=1 -d opcache.file_update_protection=0 -d opcache.jit=tracing -d opcache.jit_buffer_size=64M" ;;
          esac
          set -o pipefail
          php $flags vendor/bin/pest 2>&1 | tee pest.log
          # The function JIT's register allocator prints "ENTRY n (block b start s)
          # - live var v" when it cannot restore a value at a loop or call entry
          # point (php-src #24214), and the compiled code then reads garbage.
          # Fail on the message even when the tests pass. See
          # docs/notes/function-jit.md.
          if grep -q -- '- live var' pest.log; then
            grep -- '- live var' pest.log
            echo "::error::the function JIT reported an unrestorable value at an entry point"
            exit 1
          fi
